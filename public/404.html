<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CLOU</title>
    <!--
      GitHub Pages has no server-side SPA rewrite. When someone opens a deep
      link (e.g. /CLOU/sanctioned-offers) GitHub serves this 404 page. We encode
      the requested path into a query string and redirect to the app root; the
      script in index.html then restores the real path for react-router.
      pathSegmentsToKeep = 1 keeps the "/CLOU" project-page prefix.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
