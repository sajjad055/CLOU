
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <!-- iOS Safari otherwise auto-links bare numbers (mobile, DOB, account
           number) into tel: links, which renders them underlined and blue as if
           they were tappable. Explicit <a href="tel:"> links are unaffected. -->
      <meta name="format-detection" content="telephone=no, date=no, address=no" />
      <title>CLOU - TN - IOB (Copy)</title>
      <meta name="description" content="Create engaging mobile UI journey pages with customizable designs and features, perfect for app developers looking to enhance user experience." />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <!-- GitHub Pages SPA redirect: restores the real path saved by 404.html -->
      <script type="text/javascript">
        (function (l) {
          if (l.search[1] === '/') {
            var decoded = l.search.slice(1).split('&').map(function (s) {
              return s.replace(/~and~/g, '&');
            }).join('?');
            window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
          }
        }(window.location));
      </script>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
